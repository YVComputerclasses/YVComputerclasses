<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Document Vault</title>
    <style>
        /* ==========================================
           1. GLOBAL & RESET STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
        }

        /* ==========================================
           2. AUTHENTICATION STYLES
           ========================================== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .auth-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        /* Dynamic Error/Success Alert Box */
        .alert-message {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .toggle-text a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* ==========================================
           3. DASHBOARD STYLES
           ========================================== */
        .dashboard-container {
            display: none;
        }

        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-badge {
            background-color: #f1c40f;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }

        .logout-btn {
            background-color: #e74c3c;
            padding: 8px 15px;
            font-size: 14px;
            width: auto;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .main-content {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .action-card {
            flex: 1;
            min-width: 250px;
        }

        .action-card h4 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .action-card input, .action-card select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .section-title {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .folder-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .folder-card:hover {
            transform: translateY(-3px);
        }

        .folder-card h3 {
            font-size: 16px;
            color: #333;
        }

        .files-list {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         SECTION 1: LOGIN & REGISTER FORMS
         ========================================== -->
    <div class="auth-container" id="authSection">
        
        <!-- Login Form -->
        <div class="auth-box" id="loginBox">
            <h2>User / Admin Login</h2>
            
            <div id="loginAlert" class="alert-message alert-error"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="toggle-text">
                Naye user ho? <a onclick="toggleAuth('register')">Register karein</a>
            </p>
        </div>

        <!-- Register Form -->
        <div class="auth-box hidden" id="registerBox">
            <h2>New User Registration</h2>
            
            <div id="regAlert" class="alert-message"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="Enter full name">
                </div>
                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="Enter email address">
                </div>
                <div class="input-group">
                    <label for="regUsername">Choose Username</label>
                    <input type="text" id="regUsername" required placeholder="Choose a unique username">
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="Create password">
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p class="toggle-text">
                Pehle se account hai? <a onclick="toggleAuth('login')">Login karein</a>
            </p>
        </div>

    </div>

    <!-- ==========================================
         SECTION 2: USER DASHBOARD
         ========================================== -->
    <div class="dashboard-container" id="dashboardSection">
        
        <!-- Navbar -->
        <nav class="navbar">
            <h2>Document Vault</h2>
            <div>
                <span id="userNameDisplay">Welcome, User</span>
                <span id="adminBadge" class="admin-badge hidden">ADMIN</span> | 
                <button class="btn logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </nav>

        <div class="main-content">
            
            <!-- Actions Section: Create Folder & Upload File -->
            <div class="action-bar">
                
                <!-- Create Folder Form -->
                <div class="action-card">
                    <h4>Create New Folder</h4>
                    <input type="text" id="newFolderName" placeholder="Folder Name (e.g., Marksheet)">
                    <button class="btn" onclick="createFolder()">Create Folder</button>
                </div>

                <!-- Upload Document Form -->
                <div class="action-card">
                    <h4>Upload New Document</h4>
                    <select id="folderSelect">
                        <option value="">Select Target Folder</option>
                    </select>
                    <input type="file" id="fileInput">
                    <button class="btn" onclick="uploadFile()">Upload File</button>
                </div>

            </div>

            <!-- Folders Display Grid -->
            <h3 class="section-title">My Folders</h3>
            <div class="folders-grid" id="foldersContainer">
                <p>Abhi tak koi folder nahi bana hai.</p>
            </div>

            <!-- Uploaded Files Display Section -->
            <h3 class="section-title">Recent Documents</h3>
            <div class="files-list" id="filesContainer">
                <p>Abhi tak koi document upload nahi hua hai.</p>
            </div>

        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT LOGIC
         ========================================== -->
    <script>
        // Dummy Local Storage for Testing Username Uniqueness (Database connect hone tak)
        const registeredUsernames = ["admin"];

        function showAlert(elementId, message, type = 'error') {
            const alertBox = document.getElementById(elementId);
            alertBox.innerText = message;
            alertBox.className = `alert-message ${type === 'error' ? 'alert-error' : 'alert-success'}`;
            alertBox.style.display = 'block';
        }

        function hideAlerts() {
            document.getElementById('loginAlert').style.display = 'none';
            document.getElementById('regAlert').style.display = 'none';
        }

        function toggleAuth(view) {
            hideAlerts();
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');

            if (view === 'register') {
                loginBox.classList.add('hidden');
                registerBox.classList.remove('hidden');
            } else {
                registerBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            }
        }

        // Registration Logic with Username Uniqueness Check
        function handleRegister(event) {
            event.preventDefault();
            hideAlerts();

            const usernameInput = document.getElementById('regUsername').value.trim();
            const usernameLower = usernameInput.toLowerCase();

            // 1. Check for Reserved Admin Username
            if (usernameLower === "admin") {
                showAlert('regAlert', "Yeh username reserved hai. Kripya koi aur username chunein.");
                return;
            }

            // 2. Check for Duplicate Username
            if (registeredUsernames.includes(usernameLower)) {
                showAlert('regAlert', "Yeh Username pehle se kisi user ne le liya hai. Kripya dusra unique username try karein!");
                return;
            }

            // Register Successfully (Temporarily saving in local memory array)
            registeredUsernames.push(usernameLower);
            showAlert('regAlert', `Registration Complete! Aapka username '${usernameInput}' save ho gaya hai. Ab login karein.`, 'success');
            
            setTimeout(() => {
                toggleAuth('login');
            }, 2000);
        }

        // Login Logic
        function handleLogin(event) {
            event.preventDefault();
            hideAlerts();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const adminBadge = document.getElementById('adminBadge');

            // Admin Login Credentials Check
            if (username === "Admin" && password === "Kookie@2207") {
                adminBadge.classList.remove('hidden');
                showDashboard("Admin");
                return;
            }

            // Normal User Login Check
            adminBadge.classList.add('hidden');
            showDashboard(username);
        }

        function showDashboard(user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `Welcome, ${user}`;
        }

        function handleLogout() {
            hideAlerts();
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
        }

        function createFolder() {
            const folderName = document.getElementById('newFolderName').value.trim();
            if (!folderName) {
                alert("Kripya folder ka naam daalein!");
                return;
            }

            const foldersContainer = document.getElementById('foldersContainer');
            const folderSelect = document.getElementById('folderSelect');

            if (foldersContainer.innerHTML.includes("Abhi tak koi folder nahi bana hai.")) {
                foldersContainer.innerHTML = "";
            }

            const folderCard = document.createElement('div');
            folderCard.className = 'folder-card';
            folderCard.innerHTML = `<h3>📁 ${folderName}</h3>`;
            foldersContainer.appendChild(folderCard);

            const option = document.createElement('option');
            option.value = folderName;
            option.innerText = folderName;
            folderSelect.appendChild(option);

            document.getElementById('newFolderName').value = "";
            alert(`Folder "${folderName}" ban gaya hai!`);
        }

        function uploadFile() {
            const selectedFolder = document.getElementById('folderSelect').value;
            const fileInput = document.getElementById('fileInput');

            if (!selectedFolder) {
                alert("Pehle select karein ki kis folder me file dalni hai.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("Kripya ek file select karein.");
                return;
            }

            const fileName = fileInput.files[0].name;
            const filesContainer = document.getElementById('filesContainer');

            if (filesContainer.innerHTML.includes("Abhi tak koi document upload nahi hua hai.")) {
                filesContainer.innerHTML = "";
            }

            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <span>📄 <strong>${fileName}</strong> (Folder: ${selectedFolder})</span>
                <button style="padding: 5px 10px; background:#27ae60; color:white; border:none; border-radius:4px; cursor:pointer;">View/Download</button>
            `;
            filesContainer.appendChild(fileItem);

            fileInput.value = "";
            alert(`File "${fileName}" add ho gayi hai!`);
        }
    </script>
</body>
</html>
